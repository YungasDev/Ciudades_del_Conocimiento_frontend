<article class="news-card">
  <a [routerLink]="['/novedades', post().slug]" [class]="'news-cover ' + coverClass()" [attr.aria-label]="post().title">
    @if (post().cover; as cover) {
      <img [src]="cover.url" [alt]="cover.alt" loading="lazy" />
    } @else {
      <div class="news-cover-fallback">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="10" cy="12" r="4" />
          <circle cx="38" cy="12" r="4" />
          <circle cx="24" cy="36" r="5" />
          <path d="M14 14.5 21 31M34 14.5 27 31M14 12h20" />
        </svg>
        <span>{{ post().category?.name ?? 'Ciudades del Conocimiento' }}</span>
      </div>
    }
  </a>

  <div class="news-body">
    <div class="news-meta">
      @if (post().category; as category) {
        <span class="chip">{{ category.name }}</span>
      }
      <span class="news-date">{{ formatDate(post().publishedAt) }}</span>
    </div>

    <h3 class="news-title">
      <a [routerLink]="['/novedades', post().slug]">{{ post().title }}</a>
    </h3>
    <p class="news-excerpt">{{ post().excerpt }}</p>
    <a class="btn-link-cdc" [routerLink]="['/novedades', post().slug]">
      Leer más
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </a>
  </div>
</article>
